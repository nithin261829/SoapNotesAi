apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: soapnotesai
  annotations:
    # GKE Ingress requires NEG-backed services for the HTTPS load balancer.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
