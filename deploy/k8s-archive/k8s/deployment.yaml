apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: soapnotesai
  labels:
    app: backend
spec:
  # HPA owns this — start at 1, scale up under load.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      # GKE Autopilot enforces these defaults; declaring them explicitly is harmless.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        # IMAGE is rewritten by deploy.sh — keep the literal token.
        image: IMAGE
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: backend-config
        # Workload Identity gives us creds automatically; no GOOGLE_APPLICATION_CREDENTIALS.
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        # Drain in-flight requests cleanly during rollout.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # weasyprint needs /tmp for font cache
          capabilities:
            drop: ["ALL"]
      terminationGracePeriodSeconds: 30
