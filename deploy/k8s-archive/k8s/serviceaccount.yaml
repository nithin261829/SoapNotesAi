# Kubernetes service account bound to a GCP service account via Workload Identity.
# This is the secure way to give pods access to Firebase / Firestore / GCS / Vertex AI
# without putting a JSON key file inside the cluster.
#
# Setup (one-time, done by 02-setup-workload-identity.sh):
#   1. Create GCP SA: soapnotesai-backend@<PROJECT>.iam.gserviceaccount.com
#   2. Grant it: Firebase Admin SDK Administrator Service Agent,
#                Cloud Datastore User, Storage Object Admin,
#                Vertex AI User
#   3. Add IAM binding: this KSA -> that GSA
#   4. Annotate this KSA with the GSA email
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: soapnotesai
  annotations:
    # Filled in by 02-setup-workload-identity.sh — replace PROJECT_ID before applying.
    iam.gke.io/gcp-service-account: soapnotesai-backend@PROJECT_ID.iam.gserviceaccount.com
