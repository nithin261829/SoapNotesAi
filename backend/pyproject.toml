[project]
name = "soapnotesai-backend"
version = "0.2.0"
description = "FastAPI backend for SoapNotesAi — voice → SOAP-notes PDF"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "firebase-admin>=6.5",
    "google-cloud-storage>=2.18",
    "google-cloud-speech>=2.27",
    "google-cloud-texttospeech>=2.18",
    "google-cloud-aiplatform>=1.71",
    "weasyprint>=63.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "email-validator>=2.3.0",
    "razorpay>=2.0.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
